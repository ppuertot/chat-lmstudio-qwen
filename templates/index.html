<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con LM Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-message-user: #4a90d9;
            --bg-message-ai: #2d4a5c;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #6c757d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            height: 90vh;
            background: var(--bg-secondary);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            font-size: 13px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e74c3c;
        }

        .status-dot.online {
            background: #2ecc71;
        }

        .status-text {
            color: var(--text-primary);
            font-size: 13px;
        }

        .status-bar {
            padding: 8px 20px;
            background: var(--bg-primary);
            border-top: 1px solid #2a2a4a;
            display: flex;
            justify-content: center;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            min-height: 0;
        }

        .chat-header {
            padding: 18px 20px;
            background: var(--bg-primary);
            border-bottom: 1px solid #2a2a4a;
            text-align: center;
        }

        .chat-header h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Messages */
        #messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 14px 20px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--bg-message-user);
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--bg-message-ai);
            border-bottom-left-radius: 4px;
        }

        .message.error {
            align-self: center;
            background: #e74c3c;
            max-width: 90%;
            text-align: center;
            font-size: 13px;
            white-space: pre-wrap;
        }

        .message.system {
            align-self: center;
            background: var(--bg-primary);
            border: 1px solid var(--accent);
            max-width: 90%;
            font-size: 12px;
            text-align: center;
            padding: 10px 15px;
            border-radius: 20px;
        }

        /* Markdown dentro de las respuestas de la IA */
        .message.ai p { margin: 0 0 10px; }
        .message.ai > *:last-child { margin-bottom: 0; }
        .message.ai h1,
        .message.ai h2,
        .message.ai h3,
        .message.ai h4 { margin: 14px 0 8px; line-height: 1.3; }
        .message.ai h1 { font-size: 1.35em; }
        .message.ai h2 { font-size: 1.2em; }
        .message.ai h3 { font-size: 1.08em; }
        .message.ai h4 { font-size: 1em; }
        .message.ai ul,
        .message.ai ol { margin: 0 0 10px; padding-left: 22px; }
        .message.ai li { margin: 3px 0; }
        .message.ai a { color: #7fb2e8; }
        .message.ai code {
            background: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
        }
        .message.ai pre {
            background: #0d0d0d;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 0 0 10px;
        }
        .message.ai pre code { background: none; padding: 0; }
        .message.ai blockquote {
            border-left: 3px solid var(--accent);
            margin: 0 0 10px;
            padding-left: 12px;
            color: var(--text-secondary);
        }
        .message.ai table {
            display: block;
            overflow-x: auto;
            max-width: 100%;
            border-collapse: collapse;
            margin: 0 0 10px;
        }
        .message.ai th,
        .message.ai td {
            border: 1px solid #3a3a5a;
            padding: 6px 10px;
            text-align: left;
        }
        .message.ai th { background: rgba(0, 0, 0, 0.25); }
        .message.ai hr {
            border: none;
            border-top: 1px solid #3a3a5a;
            margin: 12px 0;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 5px;
            opacity: 0.7;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background: var(--bg-primary);
            border-top: 1px solid #2a2a4a;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
        }

        #message-input {
            flex: 1;
            padding: 15px;
            background: var(--bg-secondary);
            border: 1px solid var(--accent);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            resize: none;
            height: 54px;
        }

        #message-input:focus {
            outline: none;
            border-color: var(--bg-message-user);
        }

        .send-btn {
            padding: 12px 24px;
            background: var(--bg-message-user);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            background: #3a7bc8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 144, 217, 0.3);
        }

        .send-btn:disabled {
            background: var(--accent);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Chat Area -->
        <main class="chat-area">
            <header class="chat-header">
                <h2>🤖 Chat con LM Studio</h2>
                <p>Chat con IA local</p>
            </header>

            <div id="messages-container">
                <div class="message system">
                    👋 ¡Bienvenido! Asegúrate de que LM Studio esté ejecutando un modelo en la API (por defecto http://localhost:1234).<br><br>
                    Si no ves tu modelo cargado, ve a:
                    <strong>Settings → Select Model Tab → Click "Open"</strong>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea 
                        id="message-input" 
                        placeholder="Escribe tu mensaje aquí..."
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="send-btn">
                        Enviar ✨
                    </button>
                </div>
            </div>

            <footer class="status-bar">
                <div class="status-indicator" id="status-indicator">
                    <div class="status-dot"></div>
                    <span class="status-text" id="status-text">Conectando...</span>
                </div>
            </footer>
        </main>
    </div>

    <script src="{{ url_for('static', filename='marked.min.js') }}"></script>
    <script src="{{ url_for('static', filename='purify.min.js') }}"></script>
    <script>
        // Configuración
        const API_BASE = '/chat';
        const STATUS_CHECK_INTERVAL = 5000; // 5 segundos
        
        // Elementos DOM
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');

        // Modelo configurado en el backend (variable de entorno LM_STUDIO_MODEL)
        const DEFAULT_MODEL_ID = {{ model|tojson }};

        function initUI() {
            statusIndicator.querySelector('.status-dot').classList.add('online');
            statusText.textContent = `✅ Conectado a ${DEFAULT_MODEL_ID}`;
            addSystemMessage(`🤖 Modelo: <strong>${DEFAULT_MODEL_ID}</strong>`);
        }
        function checkStatus() {
            // El modelo configurado ya está activo
            statusIndicator.querySelector('.status-dot').classList.add('online');
            statusText.textContent = `✅ Conectado a ${DEFAULT_MODEL_ID}`;
        }

        // Renderizar Markdown (GFM) y sanear el HTML resultante
        marked.setOptions({ gfm: true, breaks: true });

        // Algunos modelos (p. ej. DeepSeek R1) envuelven toda la respuesta en
        // un bloque ```markdown ... ```. Si el bloque externo está etiquetado
        // como markdown/md, lo desenvolvemos para poder renderizarlo.
        function unwrapMarkdownFence(text) {
            const lines = text.split('\n');
            let first = lines.findIndex(l => l.trim() !== '');
            if (first === -1 || !/^```(?:markdown|md)\s*$/i.test(lines[first].trim())) {
                return text;
            }
            lines.splice(first, 1);
            let last = lines.length - 1;
            while (last >= 0 && lines[last].trim() === '') last--;
            if (last >= 0 && lines[last].trim() === '```') lines.splice(last, 1);
            return lines.join('\n');
        }

        function formatMarkdown(text) {
            return DOMPurify.sanitize(marked.parse(unwrapMarkdownFence(text)));
        }

        // Añadir mensaje al chat
        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            
            if (type === 'ai') {
                div.innerHTML = formatMarkdown(text);
            } else {
                div.textContent = text;
            }

            messagesContainer.appendChild(div);
            scrollToBottom();
        }

        // Añadir mensaje del sistema
        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'message system';
            div.innerHTML = text;
            messagesContainer.appendChild(div);
            scrollToBottom();
        }

        // Scroll al fondo
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Enviar mensaje
        async function sendMessage() {
            const message = messageInput.value.trim();
            
            if (!message) return;

            // Añadir mensaje del usuario
            addMessage(message, 'user');
            messageInput.value = '';
            messageInput.style.height = '54px';
            sendBtn.disabled = true;
            sendBtn.textContent = 'Escribiendo... ⏳';

            try {
                // Modelo configurado en el backend
                const payload = {
                    message: message
                };

                const response = await fetch(API_BASE, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const data = await response.json();
                    addMessage(data.error || `Error ${response.status}`, 'error');
                    return;
                }

                // Burbuja de IA que se va rellenando conforme llegan los tokens
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai';
                messagesContainer.appendChild(aiDiv);
                scrollToBottom();

                let aiText = '';
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                // Renderizar como máximo una vez por frame para no penalizar el streaming
                let renderScheduled = false;
                const scheduleRender = () => {
                    if (renderScheduled) return;
                    renderScheduled = true;
                    requestAnimationFrame(() => {
                        renderScheduled = false;
                        aiDiv.innerHTML = formatMarkdown(aiText);
                        scrollToBottom();
                    });
                };

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });

                    // Los eventos SSE se separan por una línea en blanco
                    const events = buffer.split('\n\n');
                    buffer = events.pop();

                    for (const event of events) {
                        const line = event.split('\n').find(l => l.startsWith('data:'));
                        if (!line) continue;
                        const raw = line.slice(5).trim();
                        if (raw === '[DONE]') continue;

                        let obj;
                        try {
                            obj = JSON.parse(raw);
                        } catch (e) {
                            continue;
                        }

                        if (obj.status === 'loading') {
                            statusIndicator.querySelector('.status-dot').classList.remove('online');
                            statusText.textContent = `⏳ ${obj.message}`;
                            continue;
                        }
                        if (obj.status === 'ready') {
                            statusIndicator.querySelector('.status-dot').classList.add('online');
                            statusText.textContent = `✅ Conectado a ${DEFAULT_MODEL_ID}`;
                            continue;
                        }

                        if (obj.error) {
                            aiDiv.className = 'message error';
                            aiDiv.textContent = obj.error;
                            scrollToBottom();
                            return;
                        }
                        if (obj.delta) {
                            aiText += obj.delta;
                            scheduleRender();
                        }
                    }
                }

                // Render final tras cerrar el stream
                aiDiv.innerHTML = formatMarkdown(aiText);
                scrollToBottom();

            } catch (error) {
                addMessage(`Error: ${error.message}`, 'error');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Enviar ✨';
            }
        }

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            const scrollHeight = this.scrollHeight;
            this.style.height = Math.min(scrollHeight, 200) + 'px';
        });

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // No hay selector de modelos (el modelo lo define el backend)

        // Inicializar UI
        initUI();
        checkStatus();

        console.log('🚀 Chat con LM Studio iniciado');
        console.log('ℹ️ Asegúrate de que LM Studio esté ejecutando un modelo');
    </script>
</body>
</html>
