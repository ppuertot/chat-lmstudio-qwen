# Configuración para Docker Compose con network_mode: host
# Esto es necesario cuando LM Studio solo escucha en localhost y no tiene habilitado el puerto 1234

services:
  chat-lmstudio-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: lmstudio-chat-web
    # Usar modo host para poder acceder a LM Studio vía localhost
    network_mode: host
    environment:
      - LM_STUDIO_URL=http://localhost:1234/v1/chat/completions
      - LM_STUDIO_MODEL=deepseek/deepseek-r1-0528-qwen3-8b
      # Idioma/tono de las respuestas (por defecto español)
      - SYSTEM_PROMPT=Responde siempre en español.
      # Parámetros de muestreo. gpt-oss rinde mejor cerca de 1.0.
      - TEMPERATURE=0.7
      - MAX_TOKENS=8192
      # Tiempo máximo de espera si el modelo se está cargando (JIT) en segundos
      - LOAD_RETRY_SECONDS=300
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Para desarrollo, descomenta la siguiente línea para montar el código Python
    # volumes:
    #   - ../app.py:/app/app.py
